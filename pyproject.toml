[project]
name = "count-soys"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "RF8", email = "-" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.14.0",
    "bcrypt>=4.2.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "opencv-python-headless>=4.10.0.84",
    "pillow>=10.4.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "scikit-image>=0.24.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32.0",
]

[project.scripts]
count-soys = "count_soys:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
