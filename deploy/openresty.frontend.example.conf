# 生产环境前端站点示例配置（宿主机 openresty / nginx）
#
# 用途：线上直接访问 /count、/history/<task_id> 等前端路由时返回 404，
#       因为 SPA 的深链接需要由 Web 服务器回退到 index.html，
#       而当前 openresty 里服务前端的 location 缺少 try_files。
#       容器版配置见 frontend/nginx.conf（已包含 try_files）。
#
# 启用步骤：
#   1. 把下面内容并入 openresty 的 server 块（按实际路径/证书/端口改）；
#   2. nginx -t 校验后 reload（openresty -t && openresty -s reload）；
#   3. 自检：curl -I https://<域名>:<端口>/count   期望 200（以前是 404）。
#
# 需要改的地方用 <尖括号> 标出。

server {
    listen 88 ssl;                          # 按实际端口
    server_name count.example.com;          # 按实际域名

    ssl_certificate     <证书路径>;
    ssl_certificate_key <私钥路径>;

    # 与前端上传限制配合（前端把长边压到 2200、质量 0.8，单张一般 1~2MB）
    client_max_body_size 12m;

    # 前端构建产物目录（frontend 执行 npm run build 后的 dist）
    root <前端 dist 绝对路径>;
    index index.html;

    # ---- 关键：SPA 回退 ----
    # 先找同名文件/目录，找不到就交给 index.html 由 vue-router 处理。
    # 没有这三行的 try_files，/count、/history/xxx 等一律 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的静态资源可以长缓存（文件名变了才会重新请求）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # index.html 不缓存，避免发版后客户端还拿旧壳子
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ---- 后端 API ----
    # 对应 docker-compose.backend.yml 暴露的 2089 端口
    location /api/ {
        proxy_pass http://127.0.0.1:2089;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- 图片文件 ----
    # 后端只暴露 uploads / results 两个子目录，其余路径（例如数据库文件）返回 404。
    location /files/ {
        proxy_pass http://127.0.0.1:2089/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
    }
}
